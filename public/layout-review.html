<!doctype html><html><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Homepage image review</title><style>body{margin:16px;background:#ddd;font:16px system-ui}header{display:flex;gap:16px;margin-bottom:12px}select,button{font:inherit;padding:8px}iframe{display:block;border:1px solid #aaa;transform-origin:top left;background:#fff}output{display:block;margin:10px 0}</style><header><label>Page <select id="page"><option value="/no">Norwegian home</option><option value="/en">English home</option><option value="/no/destinations">Destination index</option></select></label><label>Width <select id="width"><option>390</option><option>1440</option></select></label><label>Section <select id="section"><option value="">Top</option><option value="#alle-byer">Destination strip</option><option value="#utforsk">Favourites</option><option value="#thailand">Thailand</option></select></label><button id="measure">Check layout</button></header><output id="result"></output><iframe title="Homepage preview" id="preview" width="390" height="780" src="/no"></iframe><script>
const frame=document.getElementById('preview'),page=document.getElementById('page'),width=document.getElementById('width'),section=document.getElementById('section'),result=document.getElementById('result');
function measure(){const doc=frame.contentDocument,win=frame.contentWindow;result.textContent=JSON.stringify({path:win.location.pathname,width:win.innerWidth,overflow:doc.documentElement.scrollWidth>win.innerWidth,brokenLoadedImages:[...doc.images].filter(i=>i.complete&&i.naturalWidth===0).map(i=>i.alt),reusedImages:[...doc.images].filter(i=>i.src.includes('home-destinations')).length});}
function show(){frame.width=width.value;frame.height=width.value==='390'?'780':'1000';frame.style.transform=width.value==='1440'?'scale(.86)':'none';frame.src=page.value+section.value;result.textContent='Loading…';}
page.onchange=show;width.onchange=show;section.onchange=show;document.getElementById('measure').onclick=measure;frame.onload=measure;
</script></html>
