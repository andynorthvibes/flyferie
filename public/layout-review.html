<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Flyferie preview layout check</title><style>body{font:16px system-ui;margin:16px;background:#ddd}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:12px}select,button{font:inherit;padding:8px}iframe{border:1px solid #888;background:white;display:block;transform-origin:top left}output{display:block;margin:10px 0}</style><header><label>Page <select id="page"><option value="/no/destinations/tbilisi">Tbilisi</option><option value="/no/destinations/krakow">Krakow</option><option value="/no/destinations/amsterdam">Amsterdam</option><option value="/no/destinations/monaco">Monaco</option><option value="/en/destinations/phi-phi">Phi Phi (English)</option><option value="/no/destinations">Destination index</option></select></label><label>Width <select id="width"><option>390</option><option>1440</option></select></label><label>Section <select id="section"><option value="">Top</option><option value="#local-discoveries">New discoveries</option><option value="#weekend-plan">Weekend plan</option><option value="#personal-recommendations">Personal recommendations</option><option value="#stay-and-tips">Stay and tips</option></select></label><button id="measure">Check layout</button></header><output id="result"></output><iframe title="Destination preview" id="preview" width="390" height="780" src="/no/destinations/tbilisi"></iframe><script>
const frame=document.getElementById('preview'),page=document.getElementById('page'),width=document.getElementById('width'),section=document.getElementById('section'),result=document.getElementById('result');
function measure(){const doc=frame.contentDocument,win=frame.contentWindow;result.textContent=JSON.stringify({path:win.location.pathname,width:win.innerWidth,scrollWidth:doc.documentElement.scrollWidth,overflow:doc.documentElement.scrollWidth>win.innerWidth,brokenLoadedImages:[...doc.images].filter(i=>i.complete&&i.naturalWidth===0).map(i=>i.alt),cards:doc.querySelector('.discoveries-grid')?win.getComputedStyle(doc.querySelector('.discoveries-grid')).gridTemplateColumns:null});}
function show(){frame.width=width.value;frame.height=width.value==='390'?'780':'1000';frame.style.transform=width.value==='1440'?'scale(.86)':'none';frame.src=page.value+section.value;result.textContent='Loading…';}
page.onchange=show;width.onchange=show;section.onchange=show;document.getElementById('measure').onclick=measure;frame.onload=measure;
</script></html>
